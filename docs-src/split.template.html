<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>
	<title>{{title}}</title>
	<link rel="icon" type="image/svg+xml" href="./media/icon.svg" />
	<link rel="icon" type="image/png" sizes="32x32" href="./media/icon32.png" />
	<link rel="manifest" href="./manifest.json" />
	<link
		rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/kempo-css@2/dist/kempo.min.css"
	/>
	<link rel="stylesheet" href="./theme.css" />
	<script>
		window.litDisableBundleWarning = true;
		window.kempo = { pathsToIcons: ['https://cdn.jsdelivr.net/npm/kempo-ui@0.3/icons/'] };
	</script>
</head>
<body>
	<fragment name="nav" />
	<h1 class="ta-center">{{pageName}}</h1>
	<div class="row">
		<div class="col d-span-4 t-span-4 m-span-12 px">
			<location name="left" label="Left Panel" />
		</div>
		<div class="col d-span-8 t-span-8 m-span-12 px">
			<main>
				<location />
			</main>
		</div>
	</div>
	<div style="height:25vh"></div>
	<script
		type="module"
		src="https://cdn.jsdelivr.net/npm/kempo-ui@0.3/dist/components/Import.js"
	></script>
	<location name="scripts" />
</body>
</html>
